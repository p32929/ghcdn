<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN Content Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0d1117;
            color: #e6edf3;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #58a6ff;
        }
        .content-section {
            margin-bottom: 40px;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }
        .section-header {
            background: #21262d;
            padding: 15px 20px;
            border-bottom: 1px solid #30363d;
        }
        .section-title {
            margin: 0;
            font-size: 16px;
            color: #f0f6fc;
        }
        .url {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 12px;
            color: #7d8590;
            margin: 5px 0 0 0;
        }
        .content-frame {
            width: 100%;
            min-height: 400px;
            border: none;
            background: white;
        }
        .loading {
            padding: 20px;
            text-align: center;
            color: #7d8590;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CDN Content Viewer</h1>
        
        <div class="content-section">
            <div class="section-header">
                <h3 class="section-title">Gist Content</h3>
                <p class="url">http://localhost:9999/gist/p32929/7a2375cf2eb3d2986a741d7dc293a4c8</p>
            </div>
            <iframe 
                class="content-frame" 
                src="http://localhost:9999/gist/p32929/7a2375cf2eb3d2986a741d7dc293a4c8"
                onload="this.style.height = Math.max(400, this.contentWindow.document.body.scrollHeight + 50) + 'px'"
            ></iframe>
        </div>
        
        <div class="content-section">
            <div class="section-header">
                <h3 class="section-title">GitHub File Content</h3>
                <p class="url">http://localhost:9999/github/p32929/link_in_bio/master/index.html</p>
            </div>
            <iframe 
                class="content-frame" 
                src="http://localhost:9999/github/p32929/link_in_bio/master/index.html"
                onload="this.style.height = Math.max(400, this.contentWindow.document.body.scrollHeight + 50) + 'px'"
            ></iframe>
        </div>
    </div>
</body>
</html>
